# Release pipeline for the Heart 2 Heart & Love Connect Foundation site.
#
# Tag naming drives the release channel:
#   v1.2.3        -> FULL RELEASE: published to GitHub Releases and marked
#                    "latest"; the exact tagged code is then redeployed to
#                    GitHub Pages by the "pages" job below.
#   v1.2.3-rc.1   -> PRE-RELEASE: any tag containing "-" (e.g. release
#                    candidates like v1.0.0-rc.1) is published as a GitHub
#                    pre-release, never marked "latest", and Pages is left
#                    untouched. The live site therefore only ever serves a
#                    stable full release.
#
# NOTE: `make_latest` on softprops/action-gh-release@v2 must be the STRING
# "true" or "false", not a boolean expression, so both channel flags are
# computed in a shell `if` step and passed through job env vars.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository (full history for the changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Validate HTML
        run: npx --yes html-validate@9 index.html

      - name: Run smoke tests
        run: node scripts/smoke.test.mjs

      - name: Extract release notes
        run: node scripts/changelog.mjs --tag "${{ github.ref_name }}" --out notes.md

      - name: Package release archive
        run: zip -r "heart2heart-loveconnect-${{ github.ref_name }}.zip" index.html assets docs

      - name: Append SHA-256 checksum to the notes
        run: sha256sum "heart2heart-loveconnect-${{ github.ref_name }}.zip" >> notes.md

      # Pre-release when the tag contains "-" (v1.0.0-rc.1), full release
      # otherwise (v1.0.0). make_latest must stay a string.
      - name: Determine release channel
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "PRERELEASE=true" >> "$GITHUB_ENV"
            echo "MAKE_LATEST=false" >> "$GITHUB_ENV"
          else
            echo "PRERELEASE=false" >> "$GITHUB_ENV"
            echo "MAKE_LATEST=true" >> "$GITHUB_ENV"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: heart2heart-loveconnect-*.zip
          body_path: notes.md
          prerelease: ${{ env.PRERELEASE }}
          make_latest: ${{ env.MAKE_LATEST }}

  # Redeploy Pages only for full releases: pre-release tags (containing "-")
  # must never overwrite the live site.
  pages:
    name: Redeploy GitHub Pages from the release tag
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Shares the "pages" group with pages.yml so a full-release deployment
    # supersedes any in-flight main-branch deployment.
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - name: Checkout repository (at the release tag)
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
